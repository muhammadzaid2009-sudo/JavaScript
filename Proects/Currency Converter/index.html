<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="stylesheet" href="style.css" />
  
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  
  <title>Currency Converter</title>
</head>
  <body>
    <div class="container"> 
      <h2>Currency Converter</h2>
      <form aria-label="Currency converter">
        <div class="amount">
          <label for="amount-input">Enter Amount</label>
          <input id="amount-input" value="100" type="number" min="0.01" step="0.01" required placeholder="Enter amount" />
        </div>
        <div class="dropdown">
          <div class="from">
            <label for="from-select">From</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="US flag" />
              <select id="from-select" name="from" title="Select currency to convert from"></select>
            </div>
          </div>
          <button type="button" class="exchange-btn" title="Swap currencies" aria-label="Swap currencies">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
          </button>
          <div class="to">
            <label for="to-select">To</label>
            <div class="select-container">
              <img src="https://flagsapi.com/PK/flat/64.png" alt="PK flag" />
              <select id="to-select" name="to" title="Select currency to convert to"></select>
            </div>
          </div>
        </div>
        <div class="msg" aria-live="polite">1 USD = 279 PKR</div>
        <button type="button" class="submit-btn">Get Exchange Rate</button>
      </form>
    </div>

    <script src="codes.js"></script>
    <script src="App.js"></script>
  </body>
</html>
